[project]
name = "ardupilot-mcp"
version = "0.1.0"
description = "MCP server for ArduPilot parameter Q&A"
requires-python = ">=3.10"
dependencies = [
    "mcp[cli]>=1.2",
    "beautifulsoup4>=4.12",
    "lxml>=5.0",
    "httpx>=0.27",
    "sentence-transformers>=3.0",
    "lancedb>=0.13",
    "pyarrow>=17",
]

[project.scripts]
ardupilot-mcp = "ardupilot_mcp.server:main"
ardupilot-refresh = "ardupilot_mcp.ingest:main"

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv.sources]
torch = [{ index = "pytorch-cpu" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
