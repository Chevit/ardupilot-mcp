[project]
name = "ardupilot-mcp"
version = "0.1.0"
description = "MCP server for ArduPilot parameter Q&A"
requires-python = ">=3.12"
dependencies = [
    "mcp>=2.3,<3",
    "beautifulsoup4>=4.12",
    "lxml>=5.0",
    "httpx>=0.27",
    "lancedb>=0.13",
    "pyarrow>=17",
    "onnxruntime>=1.32.0",
    "tokenizers>=0.23.3",
    "huggingface-hub>=2.4.0",
]

[project.scripts]
ardupilot-mcp = "ardupilot_mcp.server:main"
ardupilot-refresh = "ardupilot_mcp.ingest:main"

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
